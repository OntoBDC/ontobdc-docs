site_name: OntoBDC - Ontology-Based Datasets & Containers
site_description: Ontology-Based Datasets & Containers
site_author: Elias M. P. Junior
site_url: https://ontobdc.org/

docs_dir: content
site_dir: ../site

# Sobrescreve a regra padrão de exclusão do MkDocs para permitir a pasta .__ontobdc__
# O MkDocs usa gitignore spec. Para liberar uma pasta oculta, precisamos ignorar os outros '.' explicitamente
# ou usar a configuração de 'not' (!) corretamente.
exclude_docs: |
  .*
  !.__ontobdc__
  !.__ontobdc__/**

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/images/ontobdc-logo.png
  favicon: assets/images/favicon.png
  icon:
    alternate: material/web
  font:
    text: Poppins
    code: Roboto Mono
  palette:
    - scheme: default
      primary: cyan
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: cyan
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.top

plugins:
  - macros

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji

extra_css:
  - assets/stylesheets/extra.css?v=20

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: Português
      link: /
      lang: pt
    - name: Español
      link: /
      lang: es

extra_javascript:
  - assets/javascripts/i18n-helpers.js

nav:
  - "Ontology-Based Datasets & Containers": index.md
