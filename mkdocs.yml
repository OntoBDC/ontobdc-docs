plugins:
- search
- macros:
    module_name: main
- mermaid2
- i18n:
    docs_structure: suffix
    fallback_to_default: true
    languages:
    - default: true
      locale: en
      name: English
repo_name: ontobdc-core
repo_url: https://github.com/eliasmpjunior/ontobdc-core
site_author: Elias M. P. Junior
site_description: Documentation for OntoBDC - Ontology-Based Data Capabilities
site_dir: site
site_name: OntoBDC Documentation
site_url: https://ontobdc.org/
theme:
  features:
  - navigation.sections
  - navigation.expand
  - search.suggest
  - search.highlight
  - content.code.copy
  language: en
  name: material
  palette:
  - accent: light-green
    primary: green
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - accent: light-green
    primary: green
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
