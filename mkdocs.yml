site_name: OntoBDC Documentation
site_description: Documentation for OntoBDC - Ontology-Based Data Capabilities
site_author: Elias M. P. Junior

repo_url: https://github.com/eliasmpjunior/ontobdc-core
repo_name: ontobdc-core
site_url: https://ontobdc.org/

docs_dir: .
site_dir: ../site

exclude_docs: |
  mkdocs.yml
  requirements.txt
  main.py

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - macros:
      module_name: main
  - mermaid2
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details

nav:
  - Home: README.md
  - Documentation:
      - Use Cases:
          - Overview: documentation/use_case/README.md
          - UC01 - Initialize Configuration: documentation/use_case/UC01_init.md
          - UC02 - Run Infrastructure Checks: documentation/use_case/UC02_check.md
          - UC03 - Run Capability: documentation/use_case/UC03_run.md
          - UC04 - List Capabilities: documentation/use_case/UC04_list.md
          - UC05 - Manage Storage: documentation/use_case/UC05_storage.md
          - UC07 - Developer Tools: documentation/use_case/UC07_dev.md
          - UC08 - A3 Module Tools: documentation/use_case/UC08_a3.md
      - Diagrams:
          - A3 Work Pipeline: documentation/diagrams/a3_work_sequence.md
  - License: LICENSE
