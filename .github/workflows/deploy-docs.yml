name: Deploy Documentation

on:
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NO_MKDOCS_2_WARNING: "1"

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            **/pyproject.toml

      - name: Prepare MkDocs Source Directory
        run: |
          # MkDocs requires the docs_dir to be a subfolder (it cannot be the root).
          # We create a temporary folder 'docs_src' and move all documentation files into it.
          mkdir docs_src
          
          # Move everything into docs_src EXCEPT .git, .github, docs_src itself, mkdocs.yml, and requirements
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" ! -name "docs_src" ! -name "mkdocs.yml" ! -name "requirements.txt" -exec mv {} docs_src/ \;

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          fi
          
      - name: Build Documentation
        run: |
          mkdocs build --clean --strict
          
      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
