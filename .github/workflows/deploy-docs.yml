name: Deploy Documentation

on:
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NO_MKDOCS_2_WARNING: "1"

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            **/pyproject.toml

      - name: Prepare MkDocs Structure
        run: |
          # Create a proper structure for mkdocs
          mkdir -p .mkdocs_build/docs
          
          # Move everything EXCEPT the new build folder into docs/
          find . -mindepth 1 -maxdepth 1 ! -name ".mkdocs_build" ! -name ".git" -exec mv {} .mkdocs_build/docs/ \;
          
          # Fetch the official mkdocs.yml from the main repo
          curl -sSL "https://raw.githubusercontent.com/OntoBDC/ontobdc-core/main/mkdocs.yml" > .mkdocs_build/mkdocs.yml
          
          # Also check EliasMPJunior/ontobdc-stack just in case
          if ! grep -q "docs_dir" .mkdocs_build/mkdocs.yml; then
            curl -sSL "https://raw.githubusercontent.com/EliasMPJunior/ontobdc-stack/main/mkdocs.yml" > .mkdocs_build/mkdocs.yml
          fi

      - name: Install dependencies
        working-directory: .mkdocs_build
        run: |
          python -m pip install --upgrade pip
          if [ -f "docs/requirements.txt" ]; then
            python -m pip install -r docs/requirements.txt
          fi
          
      - name: Build Documentation
        working-directory: .mkdocs_build
        run: |
          mkdocs build --clean --strict
          
      - name: Deploy to GitHub Pages
        working-directory: .mkdocs_build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
