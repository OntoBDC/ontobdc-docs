name: Deploy Documentation

on:
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NO_MKDOCS_2_WARNING: "1"

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            docs/requirements.txt
            **/pyproject.toml

      - name: Resolve docs paths
        shell: bash
        run: |
          # Use find to locate the actual files regardless of where checkout placed them
          REQ_FILE=$(find . -name "requirements.txt" -not -path "*/\.*" | head -n 1)
          MKDOCS_FILE=$(find . -name "mkdocs.yml" -not -path "*/\.*" | head -n 1)
          
          if [ -z "$REQ_FILE" ]; then
            echo "Error: requirements.txt not found anywhere in the repository" >&2
            exit 1
          fi
          
          if [ -z "$MKDOCS_FILE" ]; then
            echo "Error: mkdocs.yml not found anywhere in the repository" >&2
            exit 1
          fi
          
          echo "Found requirements at: $REQ_FILE"
          echo "Found mkdocs config at: $MKDOCS_FILE"
          
          # Move to the directory containing mkdocs.yml so paths inside it work correctly
          MKDOCS_DIR=$(dirname "$MKDOCS_FILE")
          echo "MKDOCS_DIR=$MKDOCS_DIR" >> "$GITHUB_ENV"
          
          # Set absolute paths to avoid any relative path issues
          echo "REQUIREMENTS_FILE=$(realpath "$REQ_FILE")" >> "$GITHUB_ENV"
          echo "MKDOCS_CONFIG=$(basename "$MKDOCS_FILE")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${REQUIREMENTS_FILE}"
          
      - name: Build Documentation
        working-directory: ${{ env.MKDOCS_DIR }}
        run: |
          mkdocs build --clean --strict --config-file "${MKDOCS_CONFIG}"
          
      - name: Deploy to GitHub Pages
        working-directory: ${{ env.MKDOCS_DIR }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --config-file "${MKDOCS_CONFIG}"
